{% extends "base.html" %}
{% block title %}Create Account — EventHub{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-8">
  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-600 to-indigo-600 items-center justify-center text-white text-2xl font-bold shadow-lg mb-4">E</div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">Join EventHub 🎉</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Discover events, connect with communities</p>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-8">
      <div id="form-error" class="hidden mb-5 flex items-start gap-3 p-4 bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 text-sm rounded-xl border border-rose-200 dark:border-rose-800"></div>

      <form hx-post="/auth/register/submit/"
            hx-target="#form-error"
            hx-swap="outerHTML"
            class="space-y-5">
        {% csrf_token %}

        <div>
          <label for="name" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
            Full name
          </label>
          <input type="text" id="name" name="name" required
                 placeholder="Your name"
                 class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
        </div>

        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
            Email address
          </label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 placeholder="you@example.com"
                 class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">
            Password
          </label>
          <input type="password" id="password" name="password" required minlength="8"
                 placeholder="At least 8 characters"
                 class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent transition">
        </div>

        <!-- Organizer toggle card -->
        <label for="is_organizer"
               class="flex items-start gap-4 p-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 hover:border-violet-300 dark:hover:border-violet-700 cursor-pointer transition-colors has-[:checked]:border-violet-500 has-[:checked]:bg-violet-50 dark:has-[:checked]:bg-violet-950">
          <input type="checkbox" id="is_organizer" name="is_organizer" value="true"
                 class="mt-0.5 h-4 w-4 rounded accent-violet-600 shrink-0">
          <div>
            <p class="text-sm font-semibold text-slate-800 dark:text-slate-200">I want to host events 🎤</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Register as an organizer to create and manage your own events</p>
          </div>
        </label>

        <button type="submit"
                class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-violet-600 to-indigo-600 hover:shadow-lg hover:shadow-violet-200 dark:hover:shadow-violet-900 hover:opacity-90 transition-all">
          Create my account →
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
        Already have an account?
        <a href="/auth/login/" class="font-semibold text-violet-600 dark:text-violet-400 hover:text-violet-800 dark:hover:text-violet-300 transition-colors">Sign in</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
