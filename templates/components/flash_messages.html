{% if messages %}
  <div id="flash-messages" class="mb-6 space-y-2">
    {% for message in messages %}
      <div class="flex items-start gap-3 px-4 py-3 rounded-xl text-sm font-medium border
        {% if message.tags == 'error' %}bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800
        {% elif message.tags == 'success' %}bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800
        {% else %}bg-violet-50 dark:bg-violet-950 text-violet-700 dark:text-violet-300 border-violet-200 dark:border-violet-800{% endif %}">
        <span class="shrink-0 mt-0.5 text-base leading-none">
          {% if message.tags == 'error' %}❌{% elif message.tags == 'success' %}✅{% else %}💬{% endif %}
        </span>
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
